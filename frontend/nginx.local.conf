server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 location = /health { access_log off; return 200 'ok'; }
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
 location /api/ {
   proxy_pass http://backend:3001;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection "upgrade";
   proxy_read_timeout 900s;
   proxy_send_timeout 900s;
   client_max_body_size 30m;
   proxy_buffering off;
 }
 location /socket.io/ {
   proxy_pass http://backend:3001;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection "upgrade";
   proxy_read_timeout 900s;
   proxy_buffering off;
 }
 location / { try_files $uri $uri/ /index.html; }
}
