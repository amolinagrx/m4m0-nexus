# Standalone development stack: docker compose --env-file .env -f docker-compose.dev.yml up -d
name: m4m0-nexus-dev
services:
  database:
    build: ./database
    environment:
      POSTGRES_USER: nexus_owner
      POSTGRES_DB: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    ports: ['127.0.0.1:5432:5432']
    volumes: [dev_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nexus_owner -d nexus']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports: ['127.0.0.1:6379:6379']
    volumes: [dev_redis:/data]
volumes:
  dev_postgres: {}
  dev_redis: {}
