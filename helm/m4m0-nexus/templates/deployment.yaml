{{- range $component := list "backend" "frontend" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus.fullname" $ }}-{{ $component }}
  labels:
    {{- include "nexus.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ if eq $component "backend" }}{{ $.Values.replicaCount }}{{ else }}1{{ end }}
  strategy:
    type: {{ if and (eq $component "backend") $.Values.persistence.enabled }}Recreate{{ else }}RollingUpdate{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ if eq $component "backend" }}1000{{ else }}101{{ end }}
        fsGroup: {{ if eq $component "backend" }}1000{{ else }}101{{ end }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $component }}
          image: {{ index $.Values.image $component | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ if eq $component "backend" }}3001{{ else }}8080{{ end }}
          {{- if eq $component "backend" }}
          envFrom:
            - configMapRef:
                name: {{ include "nexus.fullname" $ }}
            - secretRef:
                name: {{ $.Values.existingSecret }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml (index $.Values.resources $component) | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ if eq $component "backend" }}/health/live{{ else }}/health{{ end }}
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: {{ if eq $component "backend" }}/health/ready{{ else }}/health{{ end }}
              port: http
            initialDelaySeconds: 5
          startupProbe:
            httpGet:
              path: {{ if eq $component "backend" }}/health/live{{ else }}/health{{ end }}
              port: http
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $component "backend" }}
            - name: backups
              mountPath: /data/backups
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq $component "backend" }}
        - name: backups
          {{- if $.Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nexus.fullname" $ }}-backups
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
{{- end }}
