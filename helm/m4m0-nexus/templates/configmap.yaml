apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexus.fullname" . }}
data:
  NODE_ENV: production
  PORT: '3001'
  CORS_ORIGIN: {{ .Values.corsOrigin | quote }}
  WEBHOOK_ALLOWED_ORIGINS: {{ .Values.webhookAllowedOrigins | quote }}
  BACKUP_DIR: /data/backups
  PLUGIN_DIR: /opt/nexus/plugins
