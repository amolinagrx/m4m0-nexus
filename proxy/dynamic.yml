http:
  routers:
    api:
      rule: 'Host(`{{ env "NEXUS_HOST" }}`) && (PathPrefix(`/api/`) || PathPrefix(`/socket.io`))'
      entryPoints: [websecure]
      service: backend
      priority: 20
      tls:
        certResolver: letsencrypt
    frontend:
      rule: 'Host(`{{ env "NEXUS_HOST" }}`)'
      entryPoints: [websecure]
      service: frontend
      tls:
        certResolver: letsencrypt
  services:
    backend:
      loadBalancer:
        servers:
          - url: http://backend:3001
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:8080
